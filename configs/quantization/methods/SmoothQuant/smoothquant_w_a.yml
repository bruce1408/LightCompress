base:
    seed: &seed 42
model:
    type: Llama
    path: /mnt/share_disk/Meta-Llama-3-8B
    torch_dtype: auto
calib:
    name: pileval
    download: False
    path: /mnt/share_disk/LLM_workspace/datasets/pileval
    n_samples: 512
    bs: 1
    seq_len: 512
    preproc: txt_general_preproc
    seed: *seed
eval:
    eval_pos: [pretrain, transformed, fake_quant]
    name: wikitext2
    download: False
    path: /mnt/share_disk/LLM_workspace/datasets/wikitext2
    seq_len: 2048
    # For 7B / 13B model eval, bs can be set to "1", and inference_per_block can be set to "False".
    # For 70B model eval, bs can be set to "20", and inference_per_block can be set to "True".
    bs: 4
    inference_per_block: False
quant:
    method: SmoothQuant
    weight:
        bit: 8
        symmetric: True
        granularity: per_channel
    act:
        bit: 8
        symmetric: True
        granularity: per_token
    special:
        alpha: 0.8
save:
    save_trans: False
    save_fake: False
    save_path: /mnt/share_disk/LLM_workspace/Quantizer-Tools/_output/llm_log/Llama_3_8B_smoothquant_w_a
